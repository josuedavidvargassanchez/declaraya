spring.application.name=declaraya
server.port=8080

# Detecta automáticamente si está en Docker (usa 'mysql') o en tu PC (usa 'localhost:3307')
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/declaraya_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

declaraya.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.error.include-message=always
declaraya.demo-data=true