<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeclaraYa - Editar usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('inicio')}"></div>
<div class="layout">
    <main class="content content-narrow">
        <div class="page-title">
            <h2>Editar usuario</h2>
            <p class="page-lead" th:text="${u.email}">correo</p>
        </div>
        <p class="error" th:if="${param.error}" th:text="${param.error}">Error</p>

        <form th:action="@{'/admin/usuarios/' + ${u.id} + '/editar'}" method="post" class="auth-form form-pro">
            <fieldset class="form-section">
                <div class="form-row">
                    <div><label for="nombre">Nombre completo</label><input type="text" id="nombre" name="nombre" th:value="${u.nombre}" required></div>
                    <div><label for="email">Correo</label><input type="email" id="email" name="email" th:value="${u.email}" required></div>
                </div>
                <label for="password">Nueva contraseña (déjala vacía para no cambiarla)</label>
                <input type="text" id="password" name="password" minlength="6" autocomplete="off">
                <div class="form-row">
                    <div><label for="rol">Rol</label>
                        <select id="rol" name="rol" required>
                            <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.etiqueta}" th:selected="${u.rol == r}"></option>
                        </select></div>
                    <div><label for="tarjetaProfesional">Tarjeta profesional</label>
                        <input type="text" id="tarjetaProfesional" name="tarjetaProfesional" th:value="${u.tarjetaProfesional}"></div>
                </div>
                <div class="form-row">
                    <div><label for="tarifaBase">Tarifa base (COP)</label>
                        <input type="number" id="tarifaBase" name="tarifaBase" min="0" step="1000"
                               th:value="${u.tarifaBase != null ? u.tarifaBase.toBigInteger() : ''}"></div>
                    <div><label for="mentorId">Mentor (solo practicantes)</label>
                        <select id="mentorId" name="mentorId">
                            <option value="">Sin mentor</option>
                            <option th:each="m : ${mentores}" th:value="${m.id}" th:text="${m.nombre}"
                                    th:selected="${u.mentor != null and u.mentor.id == m.id}"></option>
                        </select></div>
                </div>
                <label class="check-item check-solo"><input type="checkbox" name="verificado" value="true" th:checked="${u.verificado}"> <span>Contador verificado (puede ofertar)</span></label>
            </fieldset>
            <button type="submit">Guardar cambios</button>
        </form>
        <p class="link-secondary"><a th:href="@{/admin/usuarios}">&larr; Volver a usuarios</a></p>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
