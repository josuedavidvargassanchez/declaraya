<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DeclaraYa - Crear cuenta</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-container">
    <h1>Crear cuenta</h1>

    <form th:action="@{/registro}" th:object="${registro}" method="post" class="auth-form">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" th:field="*{nombre}">
        <p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>

        <label for="email">Correo</label>
        <input type="email" id="email" th:field="*{email}">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Contraseña (mínimo 6 caracteres)</label>
        <input type="password" id="password" th:field="*{password}">
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="rol">Tipo de cuenta</label>
        <select id="rol" th:field="*{rol}">
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}"></option>
        </select>
        <p class="error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></p>

        <label for="tarjetaProfesional">Tarjeta profesional (solo contadores)</label>
        <input type="text" id="tarjetaProfesional" th:field="*{tarjetaProfesional}">
        <p class="error" th:if="${#fields.hasErrors('tarjetaProfesional')}" th:errors="*{tarjetaProfesional}"></p>

        <div class="checkbox-row">
            <input type="checkbox" id="aceptaPolitica" th:field="*{aceptaPolitica}">
            <label for="aceptaPolitica">Acepto la <a th:href="@{/politica-datos}" target="_blank">politica de tratamiento de datos</a></label>
        </div>
        <p class="error" th:if="${#fields.hasErrors('aceptaPolitica')}" th:errors="*{aceptaPolitica}"></p>

        <button type="submit">Crear cuenta</button>
    </form>

    <p class="link-secondary">Ya tienes cuenta? <a th:href="@{/login}">Inicia sesion</a></p>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
