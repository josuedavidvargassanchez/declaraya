<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeclaraYa - Editar oferta</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('inicio')}"></div>

<div class="layout">
    <main class="content content-narrow">
        <div class="page-title">
            <h2>Editar oferta</h2>
            <p class="page-lead" th:text="${'Solicitud: ' + oferta.solicitud.titulo}">Solicitud</p>
        </div>
        <div class="meta-row">
            <span class="chip" th:if="${oferta.solicitud.anioGravable != null}" th:text="${'Año ' + oferta.solicitud.anioGravable}">Año</span>
            <span class="chip chip-dinero" th:if="${oferta.solicitud.presupuestoMaximo != null}"
                  th:text="${'Presupuesto del cliente: $ ' + #numbers.formatDecimal(oferta.solicitud.presupuestoMaximo, 1, 'POINT', 0, 'COMMA')}">Presupuesto</span>
        </div>

        <p class="error" th:if="${param.errorValor}">El valor propuesto debe ser mayor que cero.</p>
        <p class="error" th:if="${param.errorMensaje}">Escribe un mensaje (máximo 500 caracteres).</p>

        <form th:action="@{'/ofertas/' + ${oferta.id} + '/editar'}" method="post" class="auth-form form-pro">
            <fieldset class="form-section">
                <label for="mensaje">Mensaje para el cliente</label>
                <textarea id="mensaje" name="mensaje" rows="4" maxlength="500" required th:text="${oferta.mensaje}"></textarea>

                <label for="valorPropuesto">Valor propuesto (COP)</label>
                <input type="number" id="valorPropuesto" name="valorPropuesto" min="1" step="1000" required th:value="${oferta.valorPropuesto != null ? oferta.valorPropuesto.toBigInteger() : ''}">
            </fieldset>
            <button type="submit">Guardar cambios</button>
        </form>
        <p class="link-secondary"><a th:href="@{${volver}}">Cancelar</a></p>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
