<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contapuente - Disputas cerradas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/menu :: menu('inicio')}"></div>

    <div class="layout">
      <aside th:replace="~{fragments/sidebar :: sidebar('inicio')}"></aside>

      <main class="content">
        <div class="content-header">
          <div>
            <h2>Disputas cerradas</h2>
            <p class="page-lead">Historial de disputas resueltas o cerradas sin sanción, con su decisión.</p>
          </div>
        </div>

        <div class="list">
          <div class="list-item" th:each="d : ${disputas}">
            <span th:text="${'Disputa #' + d.id}">Disputa</span>
            <span th:text="${'Acuerdo #' + d.acuerdo.id}">Acuerdo</span>
            <span th:class="${'badge badge-' + #strings.toLowerCase(d.estado.name())}" th:text="${d.estado}">Estado</span>
            <span class="tag" th:text="${d.resultado != null ? d.resultado.etiqueta : 'Decisión no registrada'}">Decisión</span>
            <span class="list-meta"
                  th:text="${d.fechaResolucion != null ? 'Resuelta el ' + #temporals.format(d.fechaResolucion, 'dd/MM/yyyy') : 'Fecha no registrada'}">Fecha</span>
            <a th:href="@{'/admin/disputas/' + ${d.id}}" class="btn btn-small btn-muted list-accion">Ver detalle</a>
          </div>
          <p th:if="${disputas.isEmpty()}" class="empty">Todavía no hay disputas cerradas.</p>
        </div>

        <p class="link-secondary"><a th:href="@{/admin/inicio}">&larr; Volver al panel</a></p>
      </main>
    </div>

    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
