<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeclaraYa - Notificaciones</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('notificaciones')}"></div>

<div class="layout">
    <aside th:replace="~{fragments/sidebar :: sidebar('notificaciones')}"></aside>

    <main class="content">
        <div class="content-header">
            <div>
                <h2>Notificaciones</h2>
                <p class="page-lead">Novedades de tus solicitudes, ofertas y acuerdos.</p>
            </div>
            <form th:action="@{/notificaciones/leer}" method="post" th:if="${notifCount != null and notifCount > 0}">
                <button type="submit" class="btn-small btn-muted">Marcar todas como leídas</button>
            </form>
        </div>

        <div class="notif-list">
            <a class="notif" th:each="n : ${notificaciones}" th:href="@{${n.enlace != null ? n.enlace : '/inicio'}}"
               th:classappend="${!n.leida} ? 'notif-nueva'">
                <span class="notif-ico"><span th:replace="~{fragments/icons :: i('bell')}"></span></span>
                <span class="notif-texto">
                    <span th:text="${n.mensaje}">Mensaje</span>
                    <small th:text="${n.fechaCorta}">01/01/2026 10:00</small>
                </span>
                <span class="notif-punto" th:if="${!n.leida}"></span>
            </a>
        </div>
        <div class="empty-state" th:if="${notificaciones.isEmpty()}">
            <span th:replace="~{fragments/icons :: i('bell')}"></span>
            <h3>Estás al día</h3>
            <p>Cuando haya novedades, las verás aquí.</p>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
