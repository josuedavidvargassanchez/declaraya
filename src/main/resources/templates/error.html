<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contapuente - Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="pub-body">
<div class="auth-container error-box">
    <div class="error-ico"><span th:replace="~{fragments/icons :: i('alert')}"></span></div>
    <h1 th:text="${status}">404</h1>
    <!-- titulo en español segun el codigo; /error de Spring trae "error" en ingles y sin mensaje -->
    <p class="subtitle" th:switch="${status}">
        <span th:case="403">Acceso denegado</span>
        <span th:case="404">Página no encontrada</span>
        <span th:case="500">Error interno</span>
        <span th:case="503">Servicio no disponible</span>
        <span th:case="*" th:text="${error}">Error</span>
    </p>
    <p th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}"></p>
    <a th:href="@{/inicio}" class="btn">Volver al inicio</a>
</div>
</body>
</html>
