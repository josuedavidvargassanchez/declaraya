<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DeclaraYa - Mi perfil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('perfil')}"></div>

<div class="layout">
    <main class="content content-narrow">
        <h2>Mi perfil</h2>
        <p class="success" th:if="${param.fotoActualizada}">Foto actualizada correctamente.</p>
        <p class="success" th:if="${param.fotoEliminada}">Foto eliminada.</p>
        <p class="error" th:if="${param.errorFoto}">No se pudo guardar la foto. Usa una imagen JPG o PNG de maximo 2 MB.</p>

        <div class="perfil-card">
            <img th:if="${usuario.fotoPerfil != null}" class="avatar avatar-grande"
                 th:src="@{/usuarios/{id}/foto(id=${usuario.id},v=${usuario.fotoPerfil})}" alt="Foto de perfil">
            <span th:unless="${usuario.fotoPerfil != null}" class="avatar avatar-inicial avatar-grande"
                  th:text="${#strings.toUpperCase(#strings.substring(usuario.nombre, 0, 1))}">A</span>
            <div>
                <p class="card-title" th:text="${usuario.nombre}">Nombre</p>
                <p class="card-subtitle" th:text="${usuario.email}">correo</p>
                <span class="tag" th:text="${usuario.rol}">Rol</span>
            </div>
        </div>

        <form th:action="@{/perfil/foto(_csrf=${_csrf.token})}" method="post" enctype="multipart/form-data" class="auth-form">
            <label for="foto">Subir una nueva foto (JPG o PNG, maximo 2 MB)</label>
            <input type="file" id="foto" name="foto" accept=".jpg,.jpeg,.png" required>
            <button type="submit">Guardar foto</button>
        </form>

        <form th:if="${usuario.fotoPerfil != null}" th:action="@{/perfil/foto/eliminar}" method="post"
              class="row-actions" data-confirm="¿Eliminar tu foto de perfil?">
            <button type="submit" class="btn-small btn-muted">Eliminar foto</button>
        </form>

        <p class="link-secondary"><a th:href="@{/inicio}">Volver</a></p>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
