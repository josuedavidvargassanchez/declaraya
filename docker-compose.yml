version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: declaraya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: declaraya_db
      TZ: America/Bogota
    ports:
      # 3307 en tu PC para no chocar con el MySQL de XAMPP (que usa el 3306)
      - "3307:3306"
    volumes:
      - declaraya_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Visor web de la base de datos: http://localhost:8081
  adminer:
    image: adminer
    container_name: declaraya-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

  # Tu aplicación de Spring Boot
  app:
    build: .
    container_name: declaraya-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/declaraya_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  declaraya_data: